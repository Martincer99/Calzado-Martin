<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro</title>
<style>
    
body{
background:#39A900;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.telefono{
width:350px;
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

h2{
text-align:center;
color:#39A900;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;
}


button{
width:100%;
padding:12px;
background:#39A900;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

button:hover{
    background:#2e8500;
}

.copyright{
    margin-top:20px;
    text-align:center;
    font-size:12px;
    color:#777;
}

</style>
</head>

<body>

<div class="telefono">

<div style="display: flex;flex-direction: column;align-items: center;">
    <img src="Imagenes/CALZADO MARTIN.png" width="100">
    <h2>Registro para Calzado Martin</h2>
</div>

    <input type="text" id="nombre" placeholder="Nombres" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" title="Solo letras">

    <input type="text" id="apellido" placeholder="Apellidos" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" title="Solo letras">

    <input type="text" id="cedula" placeholder="Cédula" required inputmode="numeric" maxlength="10" minlength="7" oninput="this.value = this.value.replace(/[^0-9]/g, '')">

    <input type="email" id="usuario" placeholder="Correo electrónico" required>

    <input type="password" id="password" placeholder="Contraseña" minlength="6" required>

    <input type="password" id="confirm_password" placeholder="Confirmar Contraseña" minlength="6" required>

    <input type="date" id="fecha_nacimiento" required>

    <button type="button" onclick="validarYGuardar()">Guardar</button>
    <p class="copyright">
© 2026 Calzado Martin <br>
Desarrollado por Martin Cervantes<br>
Aprendiz ADSO - SENA
Ficha: 3336167
</p>

</div>
<script>
  function validarYGuardar() {
    const nombre = document.getElementById('nombre').value.trim();
    const apellido = document.getElementById('apellido').value.trim();
    const cedula = document.getElementById('cedula').value.trim();
    const usuario = document.getElementById('usuario').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const fecha = document.getElementById('fecha_nacimiento').value;

    // Verificar campos vacíos
    if (!nombre || !apellido || !cedula || !usuario || !password || !confirmPassword || !fecha) {
      alert("Por favor completa todos los campos.");
      return;
    }

    //validar que el nombre y apellido solo contengan letras//
    const regexSoloLetras = /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/;
    
    if (!regexSoloLetras.test(nombre)) {
      alert("El nombre solo debe contener letras.");
      return;
    }

    if (!regexSoloLetras.test(apellido)) {
      alert("El apellido solo debe contener letras.");
      return;
    }
    // Validar cédula
    if (cedula.length < 7 || cedula.length > 10) {
      alert("La cédula debe tener entre 7 y 10 dígitos.");
      return;
    }

//validar correo electrónico77
    const regexCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!regexCorreo.test(usuario)) {
      alert("Ingresa un correo electrónico válido.");
      return;
    }

    // Validar contraseñas
    if (password !== confirmPassword) {
      alert("Las contraseñas no coinciden. Verifícalas.");
      return;
    }

    localStorage.setItem("usuarioRegistrado", usuario);
    localStorage.setItem("passwordRegistrada", password);
    localStorage.setItem("nombreRegistrado", nombre);

    alert(`¡Registro Exitoso!\nBienvenido(a): ${nombre}. Ya puedes iniciar sesión.`);
    window.location.href = 'Login.html';
  }
</script>
</body>
</html>

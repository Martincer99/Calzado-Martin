<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>

body{
    background:#39A900;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.telefono{
    width:320px;
    background:white;
    border-radius:25px;
    padding:30px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:#39A900;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    background:#39A900;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#2e8500;
}

.copyright{
    margin-top:20px;
    text-align:center;
    font-size:12px;
    color:#777;
}

</style>
</head>

<body>

<div class="telefono">
    
<div style="display: flex;flex-direction: column;align-items: center;">
    <img src="Imagenes/CALZADO MARTIN.png" width="100">
    <h2>Bienvenido a Calzado Martin</h2>
</div>


<input type="email" id="usuario-login" placeholder="Correo electrónico" required>

<input type="password" id="password-login" placeholder="Contraseña" required>

<button type="button" onclick="validarInicioSesion()">Iniciar Sesión</button>

<p class="copyright">
© 2026 Calzado Martin <br>
Desarrollado por Martin Cervantes<br>
Aprendiz ADSO - SENA
Ficha: 3336167
</p>

</div>

<script>
function validarInicioSesion() {
    const usuarioIngresado = document.getElementById("usuario-login").value.trim();
    const passwordIngresada = document.getElementById("password-login").value;

//Recupera los datos que se guaradron en el Registro
    const usuarioGuardado = localStorage.getItem("usuarioRegistrado");
    const passwordGuardada = localStorage.getItem("passwordRegistrada");

    //Verificar si no hay ningun usuario registrado
    if ( !usuarioGuardado || !passwordGuardada) {
        alert(`No hay ningun usuario registardo. Por favor registrese primero.`);
        window.location.href = 'Registro.html'; // Redirige a la página de registro
        return;
    }
        //validar si el usuario y la contraseña coinciden con los datos guardados
        if (usuarioIngresado === usuarioGuardado && passwordIngresada === passwordGuardada) {
            const nombreGuardado = localStorage.getItem("nombreRegistrado");
            alert(`¡Inicio de sesión exitoso!\nBienvenido(a): ${nombreGuardado}.`);
            window.location.href = 'Catalogo.html'; // Redirige a la página de catálogo
        } else {
            //Si los datos no coinciden, muestra un mensaje de error y redirige a la página de error
            window.location.href = 'Error.html';
        }
    
}
</script>
</body>
</html>
